
{% extends 'base.html' %}

{% block content %}
<div class="container mt-5"> 
    
    <div class="row justify-content-center"> 
        <div class="col-md-6"> 
            
            <div class="card shadow"> 
                <div class="card-body"> 
                    
                    <h3 class="text-center mb-4">Registrar Nuevo Vehiculo</h3>
                    
                    <form method="POST">
                        {% csrf_token %}
                        
                        {{ form.as_p }} 
                        
                        
                        <button type="submit" class="btn btn-primary w-100">Guardar Vehiculo</button>
                    </form>
                    
                </div>
            </div> 

        </div>
    </div>

</div>
{% endblock %}
