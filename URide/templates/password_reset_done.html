{% extends 'base.html' %} 

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-7 col-lg-5 text-center">
        <div class="card shadow border-0 rounded-3 bg-white p-4 p-md-5">
            <div class="mb-4 text-success">
                <span class="fs-1">✅</span>
            </div>
            <h2 class="fw-bold text-success mb-2">¡Todo Listo!</h2>
            <p class="text-secondary mb-4">
                Tu contraseña ha sido actualizada correctamente en el sistema. Ya puedes iniciar sesión con tus nuevas credenciales.
            </p>
            
            <div class="d-grid col-sm-9 mx-auto">
                <a href="{% url 'login' %}" class="btn btn-primary btn-lg fw-bold shadow-sm py-2 fs-6">
                    Iniciar sesión ahora
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
