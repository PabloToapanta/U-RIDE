{% extends 'base.html' %} 

{% block content %}
<div class="row mt-4 mb-3">
    <div class="col-12 text-center">
        <h2 class="fw-bold text-primary">🚗 Encuentra tu Viaje</h2>
        <p class="text-muted">Viaja seguro y cómodo a la universidad con la comunidad U-RIDE.</p>
    </div>
</div>

<div class="row mb-5">
    <div class="col-12">
        <div class="card shadow-sm border-0 bg-light">
            <div class="card-body p-4">
                <form method="GET" action="{% url 'home' %}" class="row g-3 align-items-end">
                    
                    <div class="col-md-3">
                        <label class="form-label fw-bold text-secondary">📍 Origen</label>
                        <input type="text" name="origen" class="form-control" placeholder="Ej. Centro" 
                               value="{{ filtros.origen|default_if_none:'' }}">
                    </div>
                    
                    <div class="col-md-3">
                        <label class="form-label fw-bold text-secondary">🎯 Destino</label>
                        <input type="text" name="destino" class="form-control" placeholder="Ej. Campus Huachi" 
                               value="{{ filtros.destino|default_if_none:'' }}">
                    </div>
                    
                    <div class="col-md-3">
                        <label class="form-label fw-bold text-secondary">📅 Fecha</label>
                        <input type="date" name="fecha" class="form-control" 
                               value="{{ filtros.fecha|default_if_none:'' }}">
                    </div>
                    
                    <div class="col-md-3">
                        <button type="submit" class="btn btn-primary w-100 fw-bold shadow-sm">
                             Buscar Viajes
                        </button>
                    </div>
                </form>
                
                {% if filtros.origen or filtros.destino or filtros.fecha %}
                <div class="mt-3 text-end">
                    <a href="{% url 'home' %}" class="text-danger small text-decoration-none fw-bold">
                        ✖ Limpiar búsqueda
                    </a>
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>
<div class="row">
    {% if viajes %}
        {% for viaje in viajes %}
            ```
