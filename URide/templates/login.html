{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow border-0">
            <div class="card-body p-5">
                <h3 class="text-center fw-bold text-primary mb-4"> Bienvenido a U-RIDE</h3>
                
                <form method="POST">
                    {% csrf_token %}
                    
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-bold text-secondary">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                                <div class="text-danger small mt-1">
                                    {{ field.errors|striptags }}
                                </div>
                            {% endif %}
                        </div>
                    {% endfor %}
                    
                    <button type="submit" class="btn btn-primary w-100 fw-bold mt-4 shadow-sm">
                        Iniciar Sesión
                    </button>
                </form>
                
                <div class="text-center mt-4">
                    <p class="text-muted small mb-0">¿Aún no tienes cuenta?</p>
                    <a href="{% url 'registro' %}" class="text-decoration-none fw-bold">Regístrate aquí</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        let inputs = document.querySelectorAll("input");
        inputs.forEach(function(input) {
            if (input.type !== "submit" && input.type !== "hidden") {
                input.classList.add("form-control");
            }
        });
    });
</script>
{% endblock %}
