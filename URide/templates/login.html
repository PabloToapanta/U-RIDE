{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow border-0 rounded-3">
            <div class="card-body p-4 p-md-5">
                <h3 class="text-center fw-bold text-primary mb-4"> Bienvenido a U-RIDE</h3>
                
                <form method="POST">
                    {% csrf_token %}
                    
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-bold text-secondary">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                                <div class="text-danger small mt-1 fw-semibold">
                                    {{ field.errors|striptags }}
                                </div>
                            {% endif %}
                        </div>
                    {% endfor %}
                    
                    <div class="text-end mb-4">
                        <a href="{% url 'reset_password' %}" class="text-decoration-none small text-muted hover-primary">
                            ¿Olvidaste tu contraseña?
                        </a>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 fw-bold shadow-sm">
                        Iniciar Sesión
                    </button>
                </form>
                
                <hr class="my-4 text-secondary">
                
                <div class="text-center">
                    <p class="text-muted small mb-1">¿Aún no tienes cuenta?</p>
                    <a href="{% url 'registro' %}" class="btn btn-outline-secondary btn-sm w-100 fw-bold mt-2 shadow-sm">
                        Regístrate aquí
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        let inputs = document.querySelectorAll("input");
        inputs.forEach(function(input) {
            // Añadimos la clase form-control a los inputs que no son botones ni ocultos
            if (input.type !== "submit" && input.type !== "hidden") {
                input.classList.add("form-control");
            }
        });
    });
</script>
{% endblock %}
