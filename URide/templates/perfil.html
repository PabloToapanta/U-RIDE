{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-body">
                <h2 class="text-center mb-4">Mi Perfil Estudiantil</h2>
                
                {% if user.foto %}
                    <div class="text-center mb-4">
                        <img src="{{ user.foto.url }}" alt="Foto de {{ user.first_name }}" class="rounded-circle" style="width: 150px; height: 150px; object-fit: cover;">
                    </div>
                {% endif %}

                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    <div class="row">
                        {{ form.as_p }}
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 mt-3">Guardar Cambios</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
