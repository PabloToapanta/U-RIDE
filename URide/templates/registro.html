{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-body">
                <h2 class="text-center mb-4">Registro U-Ride</h2>
                
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <!--Renderiza los campos del formulario RegistroEStudianteForm-->
                    {{ form.as_p }}
                    
                    <button type="submit" class="btn btn-success w-100">Crear Cuenta</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
