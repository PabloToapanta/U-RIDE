<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <!--Bootstrap via CDN-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--navbar(Barra de navegacion),expand-lg(Responsividad),bg-dark(fondo negro),data-bs(palabras en contraste)-->
    <nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark">
      <!--container(margen a los lados)-->
      <div class="container">
        <a class="navbar-brand" href="#">U-Ride</a>

        <!--navbar-toggler(icono-hamburguesa) Es un boton-->
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#menuPrincipal"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuPrincipal">
          <!--navbar-nav(le quita los puntos a las vinietas),ms-auto(MarginStart Auto, crea un margen invisible a la isquierda)-->
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="#">Home </a>
            </li>

            {% if user.is_authenticated %}

            <li class="nav-item">
              <a class="nav-link" href="#">Viajes</a>
            </li>
            <li class="nav-item">
              <span class="nav-link text-info">Hola, {{ user.email }}</span>
            </li>
            <li class="nav-item">
              <form action="{% url 'logout' %}" method="post" class="d-inline">
                {% csrf_token %}
                <button
                  type="submit"
                  class="nav-link text-danger border-0 bg-transparent"
                >
                  Cerrar Sesión
                </button>
              </form>
            </li>

            {% else %}

            <li class="nav-item">
              <a class="nav-link" href="#">Registrarse</a>
            </li>
            <li class="nav-item">
              <a
                class="nav-link btn btn-primary text-white px-3 ms-lg-2"
                href="#"
                >Iniciar Sesión</a
              >
            </li>

            {% endif %}
          </ul>
        </div>
      </div>
    </nav>
    <main class="container mt-4">{% block content %} {% endblock %}</main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
